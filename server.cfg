# HimotheeCore v0.5.9 - txAdmin server configuration

{{serverEndpoints}}
sv_maxclients {{maxClients}}
sv_licenseKey "{{svLicense}}"

sets sv_projectName "{{serverName}}"
sets sv_projectDesc "HimotheeCore progression-focused roleplay framework"
sets locale "en-GB"

set onesync on
set mysql_connection_string "{{dbConnectionString}}"
set mysql_slow_query_warning 150

# HimotheeCore convars
setr himo:debug 1
setr himo:maxCharacters 4
setr himo:startingCash 500
setr himo:startingBank 5000
setr himo:autoSaveMs 60000
set himo:serverInstance "main"
set himo:autoBootstrapOwner 1

# Inventory / interaction stack used by native Himothee resources and bridges.
setr inventory:framework "qbx"
setr inventory:slots 50
setr inventory:weight 120000
setr inventory:target true
setr inventory:accounts '["money"]'

# Illenium Appearance
setr illenium-appearance:locale "en"

# Jim Bridge defaults. Use ox-native UI/inventory/target implementations while
# the framework-facing calls resolve through the Qbox/QB compatibility facades.
setr jim_DisableDebug false
setr jim_DisableEventDebug false
setr jim_menuScript ox
setr jim_notifyScript ox
setr jim_drawTextScript ox
setr jim_progressBarScript ox
setr jim_skillCheckScript ox
setr jim_dontUseTarget false

# Cfx.re system chat
set resources_useSystemChat true

# Base Cfx resources. HimotheeCore owns player spawning.
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
stop basic-gamemode
ensure hardcap
ensure baseevents

# Shared dependencies / interaction layer.
ensure ox_lib
ensure oxmysql
ensure ox_target

# Himothee framework authority and compatibility facades.
ensure himo_core
ensure himo_qb_bridge
ensure qb-core
ensure qbx_core
ensure qbx_vehicles

# Inventory must start after QBX facades.
ensure ox_inventory

# Exact-name QBCore helper facades backed by ox resources.
ensure qb-menu
ensure qb-input
ensure qb-target
ensure qb-inventory
ensure progressbar

# Jim Bridge uses the QBX compatibility path plus ox inventory/target.
ensure jim_bridge

# First real-world Jim gameplay acceptance resources.
ensure jim-mining
ensure jim-recycle

# Appearance / spawn / characters
ensure illenium-appearance
ensure himo_appearance
ensure himo_spawn
ensure himo_characters

# Permissions
{{addPrincipalsMaster}}
exec permissions.cfg

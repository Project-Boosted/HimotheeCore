# HimotheeCore v0.3.0 - txAdmin server configuration

{{serverEndpoints}}
sv_maxclients {{maxClients}}
sv_licenseKey "{{svLicense}}"

sets sv_projectName "{{serverName}}"
sets sv_projectDesc "HimotheeCore progression-focused roleplay framework"
sets locale "en-GB"

set onesync on
set mysql_connection_string "{{dbConnectionString}}"
set mysql_slow_query_warning 150

# HimotheeCore convars
setr himo:debug 1
setr himo:maxCharacters 4
setr himo:startingCash 500
setr himo:startingBank 5000
setr himo:autoSaveMs 60000

# Cfx.re system chat
set resources_useSystemChat true

# Base Cfx resources. HimotheeCore owns player spawning, so the stock
# basic-gamemode autospawn loop must stay stopped (same lifecycle principle
# used by Qbox).
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
stop basic-gamemode
ensure hardcap
ensure baseevents

# Dependencies
ensure ox_lib
ensure oxmysql

# Himothee framework - explicit order matters.
ensure himo_core
ensure himo_appearance
ensure himo_spawn
ensure himo_characters

# Permissions
exec permissions.cfg

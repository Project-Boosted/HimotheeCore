# HimotheeCore v0.2.1 - txAdmin server configuration

{{serverEndpoints}}
sv_maxclients {{maxClients}}
sv_licenseKey "{{svLicense}}"

sets sv_projectName "{{serverName}}"
sets sv_projectDesc "HimotheeCore progression-focused roleplay framework"
sets locale "en-GB"

# OneSync is required by the recipe metadata as well.
set onesync on

# Database connection is supplied by txAdmin's deployer.
set mysql_connection_string "{{dbConnectionString}}"
set mysql_slow_query_warning 150

# HimotheeCore convars
setr himo:debug 1
setr himo:maxCharacters 4
setr himo:startingCash 500
setr himo:startingBank 5000
setr himo:autoSaveMs 60000

# Stage 1B default spawn. Existing characters with a saved position return to
# their last location; new characters use this point until a spawn system is added.
setr himo:spawnX 215.76
setr himo:spawnY -810.12
setr himo:spawnZ 30.73
setr himo:spawnHeading 157.0

# Use the current Cfx.re built-in system chat. This must be set before chat starts.
set resources_useSystemChat true

# Base Cfx resources
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap

# Dependencies
ensure oxmysql

# Framework - explicit order matters here.
ensure himo_core
ensure himo_characters

# Permissions
exec permissions.cfg

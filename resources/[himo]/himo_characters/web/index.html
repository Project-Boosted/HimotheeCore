<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HimotheeCore Characters</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="hidden">
    <main class="shell">
        <header class="topbar">
            <div>
                <div class="eyebrow">HIMOTHEECORE</div>
                <h1>Choose your character</h1>
                <p class="subtitle">Continue an existing life or create a new one.</p>
            </div>
            <div class="account-pill">Account <span id="accountId">—</span></div>
        </header>

        <section id="notice" class="notice hidden"></section>
        <section id="error" class="error hidden"></section>

        <section class="content-grid">
            <div class="characters-panel">
                <div class="section-heading">
                    <div>
                        <h2>Your characters</h2>
                        <p id="slotSummary">0 / 4 slots used</p>
                    </div>
                    <button id="refreshButton" class="ghost-button" type="button">Refresh</button>
                </div>
                <div id="characterList" class="character-list"></div>
            </div>

            <aside class="create-panel">
                <div class="section-heading compact">
                    <div>
                        <h2>Create character</h2>
                        <p>Fill an available slot.</p>
                    </div>
                </div>

                <form id="createForm">
                    <label>
                        First name
                        <input id="firstName" name="firstName" maxlength="50" minlength="2" autocomplete="off" required>
                    </label>

                    <label>
                        Last name
                        <input id="lastName" name="lastName" maxlength="50" minlength="2" autocomplete="off" required>
                    </label>

                    <label>
                        Date of birth
                        <input id="dateOfBirth" name="dateOfBirth" type="date" required>
                    </label>

                    <div class="two-column">
                        <label>
                            Gender
                            <select id="gender" name="gender" required>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </label>

                        <label>
                            Nationality
                            <input id="nationality" name="nationality" value="British" maxlength="50" autocomplete="off">
                        </label>
                    </div>

                    <button id="createButton" class="primary-button" type="submit">Create character</button>
                </form>
            </aside>
        </section>

        <footer>
            <span>Stage 1B • Character & Player Lifecycle</span>
            <span>HimotheeCore v0.2.2</span>
        </footer>
    </main>

    <script src="app.js"></script>
</body>
</html>

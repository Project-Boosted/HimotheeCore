# HimotheeCore ACE permissions
# ACE is one supported permission authority. v0.4.2 also has persistent
# Himothee account roles, so a txAdmin account does not have to be linked
# to a FiveM provider for the framework owner/admin roles to work.
add_ace group.admin himo.admin allow
add_ace group.admin himo.staff allow
add_ace group.admin himo.dev allow

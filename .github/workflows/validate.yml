name: Validate HimotheeCore

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: himothee_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 mariadb-client python3-pip
          python3 -m pip install --break-system-packages pyyaml

      - name: Validate Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            luac -p "$file"
          done < <(find resources -type f -name '*.lua' -print0)

      - name: Validate recipe and deployment wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          with open('recipe.yaml', encoding='utf-8') as handle:
              data = yaml.safe_load(handle)
          assert data.get('$engine') == 3
          assert data.get('$onesync') in ('on', True)
          assert data.get('version') == '0.5.7'
          assert isinstance(data.get('tasks'), list) and data['tasks']
          PY
          grep -Fq 'overextended/ox_target/releases/download/v1.18.1/ox_target.zip' recipe.yaml
          grep -Fq 'overextended/ox_inventory/releases/download/v2.47.9/ox_inventory.zip' recipe.yaml
          grep -Fq 'src: https://github.com/Qbox-project/qbx_core' recipe.yaml
          grep -Fq 'ref: c1c3ca16721cd14eb814cfb95e8f8631690d247d' recipe.yaml
          grep -Fq './tmp/qbox-core-upstream/shared/vehicles.lua' recipe.yaml
          grep -Fq 'src: https://github.com/jimathy/jim_bridge' recipe.yaml
          grep -Fq 'ref: 949363c76a0cf1812b88f74ea3aafbd55b849f60' recipe.yaml
          grep -Fq 'database/006_stage1d_compatibility.sql' recipe.yaml
          grep -Fq "replace: \"playerTable = 'himo_characters'\"" recipe.yaml
          grep -Fq "replace: \"playerColumn = 'citizen_id'\"" recipe.yaml
          grep -Fq "replace: \"vehicleTable = 'himo_vehicles'\"" recipe.yaml
          grep -Fq '{{addPrincipalsMaster}}' server.cfg
          grep -Fxq 'exec permissions.cfg' server.cfg

      - name: Validate lifecycle ownership
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'stop basic-gamemode' server.cfg
          ! grep -Fxq 'ensure basic-gamemode' server.cfg
          grep -Fxq 'ensure spawnmanager' server.cfg
          grep -Fxq 'ensure baseevents' server.cfg
          grep -Fq 'txAdmin:events:serverShuttingDown' 'resources/[himo]/himo_core/server/main.lua'
          ! grep -Fq 'ui_page' 'resources/[himo]/himo_characters/fxmanifest.lua'

      - name: Validate compatibility contracts
        shell: bash
        run: |
          set -euo pipefail
          CORE='resources/[himo]/himo_core'
          test -f "$CORE/client/compat_test.lua"
          test -f "$CORE/server/compat_callbacks.lua"
          grep -Fq "HimoCommands.register('himocompat'" "$CORE/server/selftest.lua"

          for resource in qb-core qbx_core qbx_vehicles qb-menu qb-input qb-target qb-inventory progressbar; do
            test -f "resources/[himo]/${resource}/fxmanifest.lua"
          done
          test -f 'resources/[himo]/qb-inventory/config.lua'
          test -f 'resources/[himo]/qb-inventory/config/config.lua'

          # v0.5.3 live fixes: qbx_vehicles trim must return one SQL parameter.
          grep -Fq "local result = tostring(value or '')" 'resources/[himo]/qbx_vehicles/server/main.lua'
          ! grep -Fq "return tostring(value or ''):gsub" 'resources/[himo]/qbx_vehicles/server/main.lua'
          grep -Fq "TriggerEvent('qbx_core:client:setGroups', snapshot)" 'resources/[himo]/qbx_core/client/main.lua'
          grep -Fq "TriggerEvent('qbx_core:client:onGroupUpdate', groupName, groupGrade)" 'resources/[himo]/qbx_core/client/main.lua'
          SG=$(grep -nF "TriggerEvent('qbx_core:client:setGroups', snapshot)" 'resources/[himo]/qbx_core/client/main.lua' | head -n1 | cut -d: -f1)
          GU=$(grep -nF "TriggerEvent('qbx_core:client:onGroupUpdate', groupName, groupGrade)" 'resources/[himo]/qbx_core/client/main.lua' | head -n1 | cut -d: -f1)
          test "$SG" -lt "$GU"

          # Vehicle catalogue authority remains explicit and dynamic.
          grep -Fq 'local function vehicleCatalog()' 'resources/[himo]/qbx_core/server/main.lua'
          grep -Fq "GetSharedCatalog('Vehicles')" 'resources/[himo]/qbx_core/server/main.lua'
          grep -Fq 'GetLoadedVehicleCatalog()' 'resources/[himo]/qbx_core/server/main.lua'

          # v0.5.6: internal client APIs are explicit exports, not function-table hopping.
          grep -Fq "exports('GetPlayerData'" 'resources/[himo]/himo_qb_bridge/client/main.lua'
          grep -Fq "exports('Notify'" 'resources/[himo]/himo_qb_bridge/client/main.lua'
          grep -Fq "exports('Progressbar'" 'resources/[himo]/himo_qb_bridge/client/helpers.lua'
          grep -Fq "exports('HasItem'" 'resources/[himo]/himo_qb_bridge/client/helpers.lua'
          grep -Fq 'return exports.himo_qb_bridge:GetPlayerData()' 'resources/[himo]/qb-core/client/main.lua'
          grep -Fq 'QBCore.PlayerData = data' 'resources/[himo]/qb-core/client/main.lua'
          grep -Fq "exports('GetCoreObject', getCoreObject)" 'resources/[himo]/qb-core/client/main.lua'
          ! grep -Fq 'local function bridgeCore()' 'resources/[himo]/qb-core/client/main.lua'
          ! grep -Fq 'local function callBridge(' 'resources/[himo]/qb-core/client/main.lua'

          # v0.5.6: QBX client resolves live public qb-core APIs.
          grep -Fq "return exports['qb-core']:GetPlayerData()" 'resources/[himo]/qbx_core/client/main.lua'
          grep -Fq "return exports['qb-core']:GetShared(namespace)" 'resources/[himo]/qbx_core/client/main.lua'

          # v0.5.6: QBX server does not retain a startup QB object for jobs/gangs.
          grep -Fq 'local function qb()' 'resources/[himo]/qbx_core/server/main.lua'
          grep -Fq "exports('GetJobs', function() return sharedCatalog('Jobs') end)" 'resources/[himo]/qbx_core/server/main.lua'
          grep -Fq "exports('GetGangs', function() return sharedCatalog('Gangs') end)" 'resources/[himo]/qbx_core/server/main.lua'
          grep -Fq "local native = exports.himo_core:GetJobDefinitions()" 'resources/[himo]/qbx_core/server/main.lua'
          grep -Fq "local native = exports.himo_core:GetGroupDefinitions('gang')" 'resources/[himo]/qbx_core/server/main.lua'
          ! grep -Fq "local QB = exports['qb-core']:GetCoreObject()" 'resources/[himo]/qbx_core/server/main.lua'

          # v0.5.7: callback compatibility is behavioral and matches QB callback/promise semantics.
          grep -Fq 'ServerCallbacks = {}' 'resources/[himo]/qb-core/client/main.lua'
          grep -Fq 'function QBCore.Functions.TriggerCallback(name, ...)' 'resources/[himo]/qb-core/client/main.lua'
          grep -Fq 'QBCore.ServerCallbacks[name] = {' 'resources/[himo]/qb-core/client/main.lua'
          grep -Fq 'promise = pending' 'resources/[himo]/qb-core/client/main.lua'
          grep -Fq "RegisterNetEvent('QBCore:Client:TriggerCallback'" 'resources/[himo]/qb-core/client/main.lua'
          grep -Fq "exports('TriggerCallback'" 'resources/[himo]/qb-core/client/main.lua'
          grep -Fq "exports('CreateCallback'" 'resources/[himo]/qb-core/server/main.lua'
          grep -Fq "exports['qb-core']:CreateCallback('himo:compat:ping'" "$CORE/server/compat_callbacks.lua"
          grep -Fq "local trigger = core and core.Functions and core.Functions.TriggerCallback" "$CORE/client/compat_test.lua"
          grep -Fq "trigger('himo:compat:ping'" "$CORE/client/compat_test.lua"
          grep -Fq "value == 'pong'" "$CORE/client/compat_test.lua"
          ! grep -Fq "type(core.Functions.TriggerCallback) ~= 'function'" "$CORE/client/compat_test.lua"

          # Bootstrap module still precedes the public QBX API.
          test -f 'resources/[himo]/qbx_core/server/groups_catalog.lua'
          CATALOG_LINE=$(grep -nF "'server/groups_catalog.lua'" 'resources/[himo]/qbx_core/fxmanifest.lua' | cut -d: -f1)
          MAIN_LINE=$(grep -nF "'server/main.lua'" 'resources/[himo]/qbx_core/fxmanifest.lua' | cut -d: -f1)
          test "$CATALOG_LINE" -lt "$MAIN_LINE"

          grep -Fq 'setr inventory:framework "qbx"' server.cfg
          grep -Fq 'setr inventory:slots 50' server.cfg
          grep -Fq 'setr inventory:weight 120000' server.cfg
          grep -Fq 'setr jim_dontUseTarget false' server.cfg

      - name: Validate compatibility start order
        shell: bash
        run: |
          set -euo pipefail
          line() { grep -n "^ensure $1$" server.cfg | head -n1 | cut -d: -f1; }
          OXLIB=$(line ox_lib); OXMYSQL=$(line oxmysql); OXTARGET=$(line ox_target)
          CORE=$(line himo_core); INTERNAL=$(line himo_qb_bridge); QB=$(line qb-core)
          QBX=$(line qbx_core); QBXV=$(line qbx_vehicles); OXINV=$(line ox_inventory)
          QBMENU=$(line qb-menu); QBINPUT=$(line qb-input); QBTARGET=$(line qb-target)
          QBINV=$(line qb-inventory); PROGRESS=$(line progressbar); JIM=$(line jim_bridge)
          ILLENIUM=$(line illenium-appearance); APPEARANCE=$(line himo_appearance)
          SPAWN=$(line himo_spawn); CHAR=$(line himo_characters)
          test "$OXLIB" -lt "$CORE"
          test "$OXMYSQL" -lt "$CORE"
          test "$CORE" -lt "$INTERNAL"
          test "$INTERNAL" -lt "$QB"
          test "$QB" -lt "$QBX"
          test "$QBX" -lt "$QBXV"
          test "$QBXV" -lt "$OXINV"
          test "$OXTARGET" -lt "$QBTARGET"
          test "$OXINV" -lt "$QBINV"
          test "$QBMENU" -lt "$JIM"
          test "$QBINPUT" -lt "$JIM"
          test "$QBTARGET" -lt "$JIM"
          test "$QBINV" -lt "$JIM"
          test "$PROGRESS" -lt "$JIM"
          test "$JIM" -lt "$ILLENIUM"
          test "$ILLENIUM" -lt "$APPEARANCE"
          test "$SPAWN" -lt "$CHAR"

      - name: Validate release consistency
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          test "$VERSION" = '0.5.7'
          grep -Fq "version: $VERSION" recipe.yaml
          grep -Fq "HimoConfig.Version = '$VERSION'" 'resources/[himo]/himo_core/shared/config.lua'
          grep -Fq "HimoConfig.RequiredSchemaVersion = 5" 'resources/[himo]/himo_core/shared/config.lua'
          grep -Fq "HimoConfig.Stage = '1D'" 'resources/[himo]/himo_core/shared/config.lua'
          for manifest in \
            'resources/[himo]/himo_core/fxmanifest.lua' \
            'resources/[himo]/himo_qb_bridge/fxmanifest.lua' \
            'resources/[himo]/himo_characters/fxmanifest.lua' \
            'resources/[himo]/himo_spawn/fxmanifest.lua' \
            'resources/[himo]/himo_appearance/fxmanifest.lua' \
            'resources/[himo]/qb-core/fxmanifest.lua' \
            'resources/[himo]/qb-menu/fxmanifest.lua' \
            'resources/[himo]/qb-input/fxmanifest.lua' \
            'resources/[himo]/qb-target/fxmanifest.lua' \
            'resources/[himo]/qb-inventory/fxmanifest.lua' \
            'resources/[himo]/progressbar/fxmanifest.lua'; do
            grep -Fq "version '$VERSION'" "$manifest"
          done
          grep -Fq "version '1.23.0'" 'resources/[himo]/qbx_core/fxmanifest.lua'
          grep -Fq "version '1.2.0'" 'resources/[himo]/qbx_vehicles/fxmanifest.lua'

      - name: Validate SQL on MariaDB
        shell: bash
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          for sql in \
            database/001_schema.sql \
            database/002_seed.sql \
            database/003_stage1b_lifecycle.sql \
            database/004_stage1c_core_services.sql \
            database/005_stage1c_account_roles.sql \
            database/006_stage1d_compatibility.sql; do
            mariadb -h 127.0.0.1 -uroot himothee_ci < "$sql"
          done
          mariadb -N -B -h 127.0.0.1 -uroot himothee_ci -e "SELECT MAX(version) FROM himo_schema_migrations" | grep -qx '5'
          mariadb -N -B -h 127.0.0.1 -uroot himothee_ci -e "SELECT COUNT(*) FROM himo_jobs WHERE name='unemployed' AND is_active=1" | grep -qx '1'
          mariadb -N -B -h 127.0.0.1 -uroot himothee_ci -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='himothee_ci' AND TABLE_NAME='himo_characters' AND COLUMN_NAME='inventory'" | grep -qx '1'
          mariadb -N -B -h 127.0.0.1 -uroot himothee_ci -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='himothee_ci' AND TABLE_NAME='himo_vehicles' AND COLUMN_NAME IN ('glovebox','trunk')" | grep -qx '2'

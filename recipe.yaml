$engine: 3
$onesync: on

name: HimotheeCore
version: 0.3.0
author: HimotheeGaming
description: Qbox-style Stage 1B lifecycle refactor for the HimotheeCore progression-focused FiveM framework.

tasks:
  # Current Cfx.re default resources. Keep the whole tree intact so upstream
  # folder changes do not break deployment.
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources/[cfx-default]

  # ox_lib provides the non-blocking context/input UI used by multicharacter,
  # spawn selection and the Stage 1B clothing editor.
  - action: download_file
    url: https://github.com/overextended/ox_lib/releases/latest/download/ox_lib.zip
    path: ./tmp/ox_lib.zip

  - action: unzip
    src: ./tmp/ox_lib.zip
    dest: ./resources/[dependencies]

  # Database dependency.
  - action: download_file
    url: https://github.com/overextended/oxmysql/releases/latest/download/oxmysql.zip
    path: ./tmp/oxmysql.zip

  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[dependencies]

  # HimotheeCore source.
  - action: download_github
    src: https://github.com/Project-Boosted/HimotheeCore
    ref: main
    dest: ./tmp/himotheecore

  - action: move_path
    src: ./tmp/himotheecore/resources/[himo]
    dest: ./resources/[himo]

  - action: move_path
    src: ./tmp/himotheecore/server.cfg
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/himotheecore/permissions.cfg
    dest: ./permissions.cfg

  # txAdmin supplies the database credentials/context here.
  - action: connect_database

  - action: query_database
    file: ./tmp/himotheecore/database/001_schema.sql

  - action: query_database
    file: ./tmp/himotheecore/database/002_seed.sql

  - action: query_database
    file: ./tmp/himotheecore/database/003_stage1b_lifecycle.sql

  # Replace txAdmin template variables in server.cfg.
  - action: replace_string
    mode: all_vars
    file:
      - ./server.cfg

  - action: remove_path
    path: ./tmp

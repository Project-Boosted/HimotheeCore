  - action: download_github
    src: https://github.com/Qbox-project/qbx_core
    ref: c1c3ca16721cd14eb814cfb95e8f8631690d247d
    dest: ./tmp/qbox-core-upstream

  - action: download_github
    src: https://github.com/jimathy/jim_bridge
    ref: 949363c76a0cf1812b88f74ea3aafbd55b849f60
    dest: ./resources/[dependencies]/jim_bridge

  - action: download_github
    src: https://github.com/jimathy/jim-mining
    ref: 0a8a29783b78c337b2a5939c3e365dd1fcb44071
    dest: ./resources/[jim]/jim-mining

  - action: download_github
    src: https://github.com/jimathy/jim-recycle
    ref: 118df45c2a8e58ba16913dd0b64fb9164c14faf4
    dest: ./resources/[jim]/jim-recycle

  - action: download_file
    url: https://github.com/iLLeniumStudios/illenium-appearance/releases/latest/download/illenium-appearance.zip
    path: ./tmp/illenium-appearance.zip

  - action: unzip
    src: ./tmp/illenium-appearance.zip
    dest: ./resources/[dependencies]

  - action: download_github
    src: https://github.com/Project-Boosted/HimotheeCore
    ref: main
    dest: ./tmp/himotheecore

  - action: move_path
    src: ./tmp/himotheecore/resources/[himo]
    dest: ./resources/[himo]

  - action: remove_path
    path: ./resources/[himo]/qbx_core/shared/vehicles.lua

  - action: move_path
    src: ./tmp/qbox-core-upstream/shared/vehicles.lua
    dest: ./resources/[himo]/qbx_core/shared/vehicles.lua

  - action: move_path
    src: ./tmp/qbox-core-upstream/LICENSE
    dest: ./resources/[himo]/qbx_core/QBOX_UPSTREAM_LICENSE

  - action: move_path
    src: ./tmp/himotheecore/server.cfg
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/himotheecore/permissions.cfg
    dest: ./permissions.cfg

  - action: connect_database

  - action: query_database
    file: ./tmp/himotheecore/database/001_schema.sql

  - action: query_database
    file: ./tmp/himotheecore/database/002_seed.sql

  - action: query_database
    file: ./tmp/himotheecore/database/003_stage1b_lifecycle.sql

  - action: query_database
    file: ./tmp/himotheecore/database/004_stage1c_core_services.sql

  - action: query_database
    file: ./tmp/himotheecore/database/005_stage1c_account_roles.sql

  - action: query_database
    file: ./tmp/himotheecore/database/006_stage1d_compatibility.sql

  - action: query_database
    file: ./resources/[dependencies]/illenium-appearance/sql/playerskins.sql

  - action: query_database
    file: ./resources/[dependencies]/illenium-appearance/sql/player_outfits.sql

  - action: query_database
    file: ./resources/[dependencies]/illenium-appearance/sql/player_outfit_codes.sql

  - action: query_database
    file: ./resources/[dependencies]/illenium-appearance/sql/management_outfits.sql

  - action: replace_string
    mode: all_vars
    file:
      - ./server.cfg

  - action: remove_path
    path: ./tmp

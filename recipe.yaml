$engine: 3
$onesync: on

name: HimotheeCore
version: 0.1.1
author: HimotheeGaming
description: Stage 1 foundation for the HimotheeCore progression-focused FiveM framework.

tasks:
  # Download the current Cfx.re base resources once, then copy the exact
  # resources required for a clean first join/spawn.
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./tmp/cfx

  - action: ensure_dir
    path: ./resources/[cfx]

  - action: ensure_dir
    path: ./resources/[maps]

  - action: move_path
    src: ./tmp/cfx/[managers]/mapmanager
    dest: ./resources/[cfx]/mapmanager

  - action: move_path
    src: ./tmp/cfx/[managers]/spawnmanager
    dest: ./resources/[cfx]/spawnmanager

  - action: move_path
    src: ./tmp/cfx/[system]/sessionmanager
    dest: ./resources/[cfx]/sessionmanager

  - action: move_path
    src: ./tmp/cfx/[system]/chat
    dest: ./resources/[cfx]/chat

  - action: move_path
    src: ./tmp/cfx/[system]/hardcap
    dest: ./resources/[cfx]/hardcap

  # Stage 1 uses the stock freeroam gametype only as a safe bootstrap while
  # HimotheeCore's proper character/spawn flow is still under development.
  - action: move_path
    src: ./tmp/cfx/[gamemodes]/basic-gamemode
    dest: ./resources/[cfx]/basic-gamemode

  - action: move_path
    src: ./tmp/cfx/[gamemodes]/[maps]/fivem-map-hipster
    dest: ./resources/[maps]/fivem-map-hipster

  # Database dependency - release archive includes the built resource.
  - action: download_file
    url: https://github.com/overextended/oxmysql/releases/latest/download/oxmysql.zip
    path: ./tmp/oxmysql.zip

  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[dependencies]

  # HimotheeCore source.
  - action: download_github
    src: https://github.com/Project-Boosted/HimotheeCore
    ref: main
    dest: ./tmp/himotheecore

  - action: move_path
    src: ./tmp/himotheecore/resources/[himo]
    dest: ./resources/[himo]

  - action: move_path
    src: ./tmp/himotheecore/server.cfg
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/himotheecore/permissions.cfg
    dest: ./permissions.cfg

  # txAdmin supplies DB credentials/context here.
  - action: connect_database

  - action: query_database
    file: ./tmp/himotheecore/database/001_schema.sql

  - action: query_database
    file: ./tmp/himotheecore/database/002_seed.sql

  # Replace txAdmin context variables in server.cfg.
  - action: replace_string
    mode: all_vars
    file:
      - ./server.cfg

  - action: remove_path
    path: ./tmp

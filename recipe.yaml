      	['sapphire_necklace_silver'] = { label = 'Silver Sapphire Necklace', weight = 100 },
      	['diamond_earring'] = { label = 'Diamond Earring', weight = 50 },
      	['emerald_earring'] = { label = 'Emerald Earring', weight = 50 },
      	['ruby_earring'] = { label = 'Ruby Earring', weight = 50 },
      	['sapphire_earring'] = { label = 'Sapphire Earring', weight = 50 },
      	['diamond_earring_silver'] = { label = 'Silver Diamond Earring', weight = 50 },
      	['emerald_earring_silver'] = { label = 'Silver Emerald Earring', weight = 50 },
